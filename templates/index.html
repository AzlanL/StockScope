<!DOCTYPE html>
<html lang="en"> <!-- webpage language english -->
<head>
    <meta charset="UTF-8"> <!-- character encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- scales the page depending on device width -->
    <title>StockScope | Market Dashboard</title> <!-- page title -->
    <!-- Chart.js CDN for plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <!-- allows for chart plotting and interactive graphs -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a; 
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
        }
        .container { 
            max-width: 1000px;
            margin: 0 auto;
        }
        .search-box {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        /*styles the search box with the dark theme*/
        input { 
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            flex-grow: 1;
        }
        button { 
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            border: none;
            background-color: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { /*action button that darkens when you hover over it*/
            background-color: #2563eb;
        }

        .stats-panel { /*stats panel design for displaying the latest price, daily change, and volatility of the stock*/
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            padding: 1rem 1.5rem;
            flex-grow: 1;
        }
        .stat-label {
            display: block;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }
        .stat-value {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .positive { color: #10b981; }
        .negative { color: #ef4444; }


        .chart-container { /*box around the stock chart with padding and border radius for aesthetics*/
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 0.75rem;
            border: 1px solid #334155;
        }
        #error-message { /*error message that appears when the user inputs an invalid stock ticker, styled in red and hidden by default*/
            color: #ef4444;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body> <!-- visible page content -->
    <div class="container"> <!-- opens the main container and displays the main title of the webpage -->
        <h1>StockScope Market Dashboard</h1>
        
        <div class="search-box"> <!-- search box for entering stock tickers -->
            <input type="text" id="ticker-input" placeholder="Enter stock ticker (e.g., AAPL, IBM, TSLA)" value="IBM">
            <button id="search-btn">Analyze Stock</button>
        </div>

        <div id="error-message"></div> <!-- placeholder for error messages that will be displayed if the user inputs an invalid stock ticker -->

    <div class="stats-panel">
        <div class="stat">
            <span class="stat-label">Latest Price</span> <!-- panel with latest price -->
            <span class="stat-value" id="stat-price">--</span>
        </div>
        <div class="stat">
            <span class="stat-label">Daily Change</span> <!-- panel with daily change in price -->
            <span class="stat-value" id="stat-change">--</span>
        </div>
        <div class="stat">
            <span class="stat-label">Volatility (20d)</span> <!--  panel with 20day volatility using standard deviation of daily percentage change -->
            <span class="stat-value" id="stat-volatility">--</span>
        </div>
    </div>

        <div class="chart-container"> <!-- canvas allows interactive graphs to be displayed on the webpage, where the stock data will be plotted -->
            <canvas id="stockChart"></canvas>
        </div>
    </div>

    <!-- Link to static JavaScript -->
    <script src="{{ url_for('static', filename='main.js') }}"></script> <!-- generate url path to javascript file inside static folder, which contains the logic for fetching stock data and plotting it on the chart -->
</body>
</html>
